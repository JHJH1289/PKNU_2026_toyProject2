spring.application.name=drive

spring.servlet.multipart.max-file-size=50GB
spring.servlet.multipart.max-request-size=50GB

# Comma-separated storage roots. Use stable ids when you spread files across disks:
# app.storage.local.base-paths=photo1=D:/drive-photos,photo2=E:/drive-photos
app.storage.local.base-paths=local1=D:/code/toyProject2/uploads

app.admin.username=admin
app.admin.password=admin1234

# Comma-separated frontend origins allowed to call /api/**.
# Add the Mini PC frontend URL here when serving from another host.
app.security.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:8000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:8000,http://210.119.14.72:8000,https://vinylunderground.art,https://www.vinylunderground.art

spring.datasource.url=jdbc:postgresql://localhost:5432/travel_share_db
spring.datasource.username=postgres
spring.datasource.password=12341234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


jwt.secret=your-very-long-secret-key-your-very-long-secret-key-123456
jwt.expiration=1800000
